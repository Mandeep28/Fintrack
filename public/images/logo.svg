<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#0F1D38" />
      <stop offset="100%" stop-color="#082F49" />
    </linearGradient>
    <linearGradient id="shieldStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="40%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06B6D4" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Emblem Group (scaled & positioned at x=2, y=2) -->
  <g transform="translate(2, 2) scale(0.68)">
    <!-- Aerodynamic Shield Contour -->
    <path d="M 18,22 C 18,17 26,14 48,11 C 70,14 78,17 78,22 C 78,54 66,74 48,86 C 30,74 18,54 18,22 Z"
          fill="url(#shieldGrad)"
          stroke="url(#shieldStrokeGrad)"
          stroke-width="1.8"
          stroke-linejoin="round" />

    <!-- Shield Beveled Inner Contour -->
    <path d="M 22,25 C 22,21 29,18 48,15.5 C 67,18 74,21 74,25 C 74,51 63,69 48,79.5 C 33,69 22,51 22,25 Z"
          fill="none"
          stroke="#38BDF8"
          stroke-width="0.8"
          stroke-opacity="0.3" />

    <!-- Health-Plus Cross Background (Pure White Rounded Cross) -->
    <path d="M 41,22 C 41,20.5 42.5,19 44,19 L 52,19 C 53.5,19 55,20.5 55,22 L 55,29.5 L 62.5,29.5 C 64,29.5 65.5,31 65.5,32.5 L 65.5,40.5 C 65.5,42 64,43.5 62.5,43.5 L 55,43.5 L 55,51 C 55,52.5 53.5,54 52,54 L 44,54 C 42.5,54 41,52.5 41,51 L 41,43.5 L 33.5,43.5 C 32,43.5 30.5,42 30.5,40.5 L 30.5,32.5 C 30.5,31 32,29.5 33.5,29.5 L 41,29.5 Z"
          fill="#FFFFFF"
          filter="drop-shadow(0 2px 4px rgba(0,0,0,0.25))" />

    <!-- Indian Rupee Vector Symbol ('₹') Centered Inside Health Cross -->
    <g stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="43" y1="30" x2="53" y2="30" />
      <line x1="43" y1="33.5" x2="50.5" y2="33.5" />
      <path d="M 46.2,30 L 46.2,36.5 C 49.5,36.5 51.5,35.5 51.5,33.5 C 51.5,31.5 49.5,30.5 46.2,30.5" />
      <path d="M 46.2,36.5 L 52.5,43.5" />
    </g>

    <!-- Growth Bar Chart Inside Shield Base -->
    <rect x="33" y="64" width="6" height="12" rx="2" fill="url(#barGrad1)" />
    <rect x="43" y="57" width="6" height="19" rx="2" fill="url(#barGrad2)" />
    <rect x="53" y="49" width="6" height="27" rx="2" fill="url(#barGrad3)" />

    <!-- Sweeping Ascending Velocity Arc -->
    <path d="M 15,67 C 23,78 40,76 58,61 C 69,51 78,36 84,21"
          fill="none"
          stroke="url(#arrowGrad)"
          stroke-width="4.5"
          stroke-linecap="round"
          filter="url(#glow)" />

    <!-- Arrow Head -->
    <polygon points="88,14 74,19 82,27"
             fill="#10B981" />
  </g>

  <!-- Wordmark 'FinTrack' -->
  <g transform="translate(74, 47)">
    <!-- 'Fin' Text -->
    <text x="0" y="0"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="900"
          font-size="36"
          letter-spacing="-0.5"
          fill="currentColor">F<tspan dx="1">ı</tspan><tspan dx="1">n</tspan></text>

    <!-- Radiant Cyan Dot on the 'i' -->
    <circle cx="24.2" cy="-23.5" r="4.2" fill="#06B6D4" />
    <circle cx="24.2" cy="-23.5" r="2.2" fill="#38BDF8" />

    <!-- 'Track' Text with Vibrant Gradient -->
    <text x="63" y="0"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="900"
          font-size="36"
          letter-spacing="-0.5"
          fill="url(#trackGrad)">Track</text>
  </g>
</svg>